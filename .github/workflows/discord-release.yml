name: Discord release notify

# Posts a branded embed card to CutWire Discord #releases whenever a GitHub
# Release is published (including the one created by release.yml). The webhook
# URL lives in the DISCORD_WEBHOOK_URL repository secret — never in this file.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    name: Post Discord card
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post release embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is not set")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              release = json.load(f)["release"]

          EMBED_DESC_LIMIT = 4096
          DRIFT_GOLD = 0xFCAD01
          ICON = "https://raw.githubusercontent.com/CutWire-Studios/Drift/main/Drift_icon.png"

          def github_md_to_discord(text: str) -> str:
              lines = []
              for line in text.splitlines():
                  if line.startswith("### "):
                      lines.append(f"**{line[4:].strip()}**")
                  elif line.startswith("## "):
                      lines.append(f"**{line[3:].strip()}**")
                  elif line.startswith("# "):
                      lines.append(f"**{line[2:].strip()}**")
                  else:
                      lines.append(line)
              return "\n".join(lines).strip()

          def clamp(text: str, limit: int) -> str:
              if len(text) <= limit:
                  return text
              cut = text[: limit - 1]
              if "\n" in cut:
                  cut = cut.rsplit("\n", 1)[0]
              return cut.rstrip() + "…"

          def asset_label(name: str) -> str | None:
              n = name.lower()
              if "debug" in n:
                  return None
              if n.endswith(".appimage"):
                  return "Linux AppImage"
              if n.endswith(".dmg"):
                  return "macOS (Apple Silicon)"
              if "portable" in n and n.endswith(".zip"):
                  return "Windows portable"
              if "setup" in n and n.endswith(".exe"):
                  return "Windows installer"
              if n.endswith(".flatpak"):
                  return "Flatpak bundle"
              if n.endswith(".pkg.tar.zst"):
                  return "Arch Linux"
              return name

          tag = release.get("tag_name") or ""
          title = release.get("name") or f"Drift {tag}"
          url = release["html_url"]
          notes = github_md_to_discord(release.get("body") or "")
          description = clamp(notes or "New Drift release.", EMBED_DESC_LIMIT)

          downloads = [
              "[All assets](" + url + ")",
              "[Flathub](https://flathub.org/apps/org.cutwire.Drift)",
          ]
          for asset in release.get("assets") or []:
              label = asset_label(asset.get("name") or "")
              if not label:
                  continue
              downloads.append(f"[{label}]({asset['browser_download_url']})")

          payload = {
              "username": "Drift",
              "avatar_url": ICON,
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": title,
                      "url": url,
                      "description": description,
                      "color": DRIFT_GOLD,
                      "timestamp": release.get("published_at"),
                      "author": {
                          "name": "CutWire Studios",
                          "url": "https://github.com/CutWire-Studios/Drift",
                          "icon_url": ICON,
                      },
                      "thumbnail": {"url": ICON},
                      "fields": [
                          {
                              "name": "Downloads",
                              "value": clamp("\n".join(downloads), 1024),
                          }
                      ],
                      "footer": {"text": f"GitHub · {tag}"},
                  }
              ],
          }

          req = urllib.request.Request(
              webhook.split("?")[0] + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "CutWire-Drift-Release-Notify",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  msg = json.load(resp)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Discord webhook failed HTTP {exc.code}: {body}") from exc

          print(f"Posted Discord message {msg.get('id')} in channel {msg.get('channel_id')}")
          PY
